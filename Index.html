<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Sadiqah 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #fde8ef 0%, #fff5f0 40%, #fef9e7 100%);
      font-family: 'Lato', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    #petalCanvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }

    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; pointer-events: none; z-index: 0;
    }
    .bg-orb.o1 { width:420px; height:420px; background:#f4c2d0; top:-100px; left:-100px; animation: drift 12s ease-in-out infinite alternate; }
    .bg-orb.o2 { width:320px; height:320px; background:#fde68a; bottom:-80px; right:-60px; animation: drift 10s ease-in-out infinite alternate-reverse; }
    .bg-orb.o3 { width:260px; height:260px; background:#f9b8d1; top:40%; left:60%; animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(30px,20px); } }

    .page {
      position: relative; z-index: 1;
      max-width: 560px; margin: 0 auto;
      padding: 40px 20px 60px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }

    .ribbon {
      font-family: 'Dancing Script', cursive;
      font-size: 1.2rem; color: #7a3458;
      letter-spacing: 2px; text-align: center;
      opacity: 0; animation: fadeUp 0.8s 0.2s ease forwards;
    }

    .crown-row {
      font-size: 2rem; letter-spacing: 6px;
      margin: 6px 0 14px;
      opacity: 0; animation: fadeUp 0.8s 0.4s ease forwards;
    }

    .photo-wrap {
      position: relative;
      opacity: 0; animation: fadeUp 1s 0.6s ease forwards;
    }

    .photo-frame {
      width: 270px; height: 320px;
      border-radius: 50% 50% 44% 44% / 48% 48% 40% 40%;
      overflow: hidden;
      border: 6px solid white;
      box-shadow: 0 0 0 3px #e9b84a, 0 20px 50px rgba(230,120,140,0.3), 0 4px 16px rgba(0,0,0,0.1);
    }

    .photo-frame img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
    }

    .sparkle { position: absolute; font-size: 1.4rem; animation: floatSpark 3s ease-in-out infinite; }
    .sparkle:nth-child(1) { top: -12px; left: 20px; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: 10px; right: -14px; animation-delay: 0.6s; }
    .sparkle:nth-child(3) { bottom: 30px; right: -18px; animation-delay: 1.1s; }
    .sparkle:nth-child(4) { bottom: 10px; left: -14px; animation-delay: 0.3s; }
    .sparkle:nth-child(5) { top: 50%; left: -20px; animation-delay: 0.8s; }
    @keyframes floatSpark { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-10px) rotate(15deg);} }

    .name-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3.4rem; font-weight: 700;
      color: #7a3458; line-height: 1;
      text-align: center; margin-top: 22px;
      text-shadow: 2px 2px 0 rgba(244,164,176,0.4);
      opacity: 0; animation: fadeUp 0.8s 0.9s ease forwards;
    }

    .birthday-line {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem; letter-spacing: 5px;
      text-transform: uppercase; color: #e9b84a;
      margin: 4px 0 18px;
      opacity: 0; animation: fadeUp 0.8s 1.05s ease forwards;
    }

    .divider {
      display: flex; align-items: center; gap: 10px;
      width: 100%; max-width: 360px; margin-bottom: 20px;
      opacity: 0; animation: fadeUp 0.8s 1.1s ease forwards;
    }
    .divider::before,.divider::after {
      content:''; flex:1; height:1px;
      background: linear-gradient(to right, transparent, #f4a4b0, transparent);
    }
    .divider span { font-size: 1.1rem; }

    .age-section {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(244,164,176,0.4);
      border-radius: 20px; padding: 22px 28px;
      max-width: 400px; text-align: center;
      box-shadow: 0 8px 30px rgba(230,100,130,0.12);
      width: 100%; margin-bottom: 16px;
      opacity: 0; animation: fadeUp 0.9s 1.15s ease forwards;
    }

    .age-section p {
      font-family: 'Dancing Script', cursive;
      font-size: 1.25rem; color: #7a3458; margin-bottom: 14px;
    }

    .age-input-row {
      display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
    }

    .age-input {
      border: 2px solid #f4a4b0;
      border-radius: 50px; padding: 9px 18px;
      font-family: 'Lato', sans-serif; font-size: 1rem;
      color: #7a3458; background: white;
      outline: none; width: 100px; text-align: center;
    }
    .age-input:focus { border-color: #e9b84a; }

    .reveal-btn {
      padding: 10px 22px;
      background: linear-gradient(135deg, #f28c7b, #f4a4b0);
      border: none; border-radius: 50px;
      font-family: 'Dancing Script', cursive; font-size: 1.15rem;
      color: white; cursor: pointer;
      box-shadow: 0 4px 16px rgba(242,140,123,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .reveal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(242,140,123,0.5); }

    .message-card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(244,164,176,0.4);
      border-radius: 24px; padding: 28px 30px;
      max-width: 420px; text-align: center;
      box-shadow: 0 8px 30px rgba(230,100,130,0.12);
      display: none;
    }
    .message-card.visible {
      display: block;
      animation: fadeUp 0.9s ease forwards;
    }

    .message-card p {
      font-size: 1.03rem; line-height: 1.85;
      color: #5a3040; font-weight: 300;
    }
    .message-card p strong { font-weight: 400; color: #7a3458; font-style: italic; }

    .age-badge {
      display: inline-block;
      background: linear-gradient(135deg, #e9b84a, #f4a4b0);
      color: white; font-family: 'Dancing Script', cursive;
      font-size: 1.4rem; padding: 6px 20px;
      border-radius: 50px; margin-bottom: 14px;
    }

    .emoji-strip {
      font-size: 1.6rem; letter-spacing: 8px;
      margin: 22px 0 8px;
      opacity: 0; animation: fadeUp 0.8s 1.45s ease forwards;
    }

    .from-tag {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem; font-style: italic;
      color: #f28c7b; letter-spacing: 1px;
      opacity: 0; animation: fadeUp 0.8s 1.55s ease forwards;
    }

    .confetti-btn {
      margin-top: 28px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #f28c7b, #f4a4b0, #e9b84a);
      border: none; border-radius: 50px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem; color: white; cursor: pointer;
      box-shadow: 0 6px 24px rgba(242,140,123,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      opacity: 0; animation: fadeUp 0.8s 1.7s ease forwards;
    }
    .confetti-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 32px rgba(242,140,123,0.55); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(26px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .heart-float {
      position: fixed; font-size: 1.2rem;
      pointer-events: none;
      animation: riseHeart 4s ease-in forwards; z-index: 5;
    }
    @keyframes riseHeart {
      0%  { opacity:1; transform:translateY(0) scale(1); }
      100%{ opacity:0; transform:translateY(-320px) scale(0.5); }
    }
  </style>
</head>
<body>

<canvas id="petalCanvas"></canvas>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-orb o3"></div>

<div class="page">
  <p class="ribbon">✨ A Special Message Just For You ✨</p>
  <div class="crown-row">👑🌸💛🌸👑</div>

  <div class="photo-wrap">
    <div class="photo-frame">
      <img id="sadiqahPhoto" src="" alt="Sadiqah"/>
    </div>
    <span class="sparkle">🌸</span>
    <span class="sparkle">✨</span>
    <span class="sparkle">🌼</span>
    <span class="sparkle">💖</span>
    <span class="sparkle">🌺</span>
  </div>

  <h1 class="name-title">Sadiqah</h1>
  <p class="birthday-line">Happy Birthday</p>

  <div class="divider"><span>🌷</span></div>

  <!-- Age input section -->
  <div class="age-section">
    <p>How old are you turning today, princess? 🎀</p>
    <div class="age-input-row">
      <input class="age-input" id="ageInput" type="number" min="1" max="99" placeholder="e.g. 20"/>
      <button class="reveal-btn" onclick="revealMessage()">Reveal 🌸</button>
    </div>
  </div>

  <!-- Hidden message card -->
  <div class="message-card" id="messageCard">
    <div class="age-badge" id="ageBadge"></div>
    <p id="messageText"></p>
  </div>

  <div class="emoji-strip">🌸🌼🌺🌸🌼🌺🌸</div>
  <p class="from-tag">With so much love, from your big cousin 💕</p>

  <button class="confetti-btn" onclick="burstConfetti()">🎉 Tap to Celebrate! 🎉</button>
</div>

  /* ── Falling petals ── */
  const canvas = document.getElementById('petalCanvas');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const EMOJIS=['🌸','🌺','🌼','🌷','✨','💖','🌻'];
  const petals=Array.from({length:38},()=>({
    x:Math.random()*window.innerWidth, y:Math.random()*-window.innerHeight,
    emoji:EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
    size:14+Math.random()*18, speed:0.7+Math.random()*1.2,
    drift:(Math.random()-0.5)*0.6, spin:(Math.random()-0.5)*0.04,
    angle:Math.random()*Math.PI*2, opacity:0.55+Math.random()*0.45,
  }));
  function drawPetals(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    petals.forEach(p=>{
      ctx.save(); ctx.globalAlpha=p.opacity;
      ctx.font=`${p.size}px serif`;
      ctx.translate(p.x,p.y); ctx.rotate(p.angle);
      ctx.fillText(p.emoji,0,0); ctx.restore();
      p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
      if(p.y>canvas.height+30){ p.y=-30; p.x=Math.random()*canvas.width; }
    });
    requestAnimationFrame(drawPetals);
  }
  drawPetals();

  /* ── Age reveal ── */
  function revealMessage(){
    const age = parseInt(document.getElementById('ageInput').value);
    if(!age || age < 1 || age > 99){
      document.getElementById('ageInput').style.borderColor='#f28c7b';
      document.getElementById('ageInput').placeholder='Enter your age!';
      return;
    }
    document.getElementById('ageInput').style.borderColor='#e9b84a';
    const badge = document.getElementById('ageBadge');
    const text  = document.getElementById('messageText');
    const card  = document.getElementById('messageCard');

    badge.textContent = `🎂 Turning ${age} 🎂`;

    text.innerHTML = `
      To my <strong>beautiful, radiant little cousin</strong> —<br/><br/>
      Today you turn <strong>${age}</strong> and with every year you get more
      wonderful, more gorgeous, and more loved than ever! 🌸<br/><br/>
      You brighten every room you walk into, just like you're doing right now
      in that stunning outfit. May year <strong>${age}</strong> be filled
      with all the joy, laughter, and blessings you truly deserve.<br/><br/>
      You are so <strong>deeply loved</strong>, never forget that! 💛
    `;

    card.classList.add('visible');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    burstConfetti();
  }

  /* Allow Enter key */
  document.getElementById('ageInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') revealMessage();
  });

  /* ── Confetti burst ── */
  let celebratingInterval = null;

  function burstConfetti(){
    // Fire an initial burst
    for(let i=0;i<30;i++) setTimeout(spawnHeart, i*55);

    // If not already running, start continuous rain
    if(!celebratingInterval){
      celebratingInterval = setInterval(()=>{
        spawnHeart();
        spawnHeart();
      }, 300);

      // Update button text
      const btn = document.querySelector('.confetti-btn');
      btn.textContent = '🎉 Celebrating! Tap to Stop 🎉';
      btn.onclick = stopCelebrating;
    }
  }

  function stopCelebrating(){
    if(celebratingInterval){
      clearInterval(celebratingInterval);
      celebratingInterval = null;
    }
    const btn = document.querySelector('.confetti-btn');
    btn.textContent = '🎉 Tap to Celebrate! 🎉';
    btn.onclick = burstConfetti;
  }

  function spawnHeart(){
    const el=document.createElement('div');
    el.className='heart-float';
    const icons=['💖','🌸','✨','🌺','💛','🌼','🎀','💕','🎉','🌹','💗','⭐','🌟'];
    el.textContent=icons[Math.floor(Math.random()*icons.length)];
    el.style.left=(5+Math.random()*90)+'vw';
    el.style.bottom='0';
    el.style.fontSize=(1+Math.random()*1.6)+'rem';
    el.style.animationDuration=(2.5+Math.random()*2.5)+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
</script>
</body>
